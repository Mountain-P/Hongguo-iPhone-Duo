name: Core tests and iPhone SDK check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Core tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test content protocols
        run: swift test --disable-xctest

  simulator:
    name: Simulator SDK check / optional build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Find an installed SDK with the required Duo API
        id: sdk
        shell: bash
        run: |
          python3 <<'PY'
          import glob
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          # iOS availability guards do not let an older SDK resolve these symbols.
          probe = '''import SwiftUI
          @available(iOS 27.1, *)
          func requiredDuoAPI(_ geometry: GeometryProxy) {
              let divisions = geometry.reservedRegions(kind: .division).filter { $0.isActive }
              let occlusions = geometry.reservedRegions(kind: .occlusion).filter { $0.isActive }
              for region in divisions + occlusions {
                  _ = region.frame
                  _ = region.margins
              }
          }
          '''
          selected = subprocess.check_output(['xcode-select', '-p'], text=True).strip()
          candidates = [selected] + [str(Path(app) / 'Contents/Developer')
                                     for app in sorted(glob.glob('/Applications/Xcode*.app'), reverse=True)]
          compatible = None
          for developer in dict.fromkeys(candidates):
              env = dict(os.environ, DEVELOPER_DIR=developer)
              try:
                  version = subprocess.check_output(
                      ['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'],
                      env=env, text=True, stderr=subprocess.DEVNULL, timeout=20).strip()
                  parts = re.match(r'^(\d+)\.(\d+)', version)
                  if not parts or tuple(map(int, parts.groups())) < (27, 1):
                      print(f'Incompatible simulator SDK {version}: {developer}')
                      continue
                  sdk_path = subprocess.check_output(
                      ['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-path'],
                      env=env, text=True, stderr=subprocess.DEVNULL, timeout=20).strip()
                  with tempfile.TemporaryDirectory(prefix='hongguo-sdk-') as directory:
                      source = Path(directory) / 'DuoAPI.swift'
                      source.write_text(probe)
                      result = subprocess.run(
                          ['xcrun', '--sdk', 'iphonesimulator', 'swiftc', '-typecheck',
                           '-target', 'arm64-apple-ios17.0-simulator', '-sdk', sdk_path,
                           '-module-cache-path', str(Path(directory) / 'ModuleCache'), str(source)],
                          env=env, text=True, capture_output=True, timeout=90)
                      if result.returncode != 0:
                          print(f'SDK {version} does not compile the required Duo API: {developer}')
                          print(result.stderr)
                          continue
                  compatible = (developer, version)
                  break
              except (subprocess.SubprocessError, OSError) as error:
                  print(f'Could not inspect {developer}: {type(error).__name__}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'available={str(compatible is not None).lower()}\n')
          if compatible:
              developer, version = compatible
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f'DEVELOPER_DIR={developer}\n')
              print(f'Using compatible simulator SDK {version}: {developer}')
          else:
              message = ('SKIPPED: iPhone simulator build was not run. This runner has no installed '
                         'iOS Simulator SDK >=27.1 that compiles GeometryProxy.reservedRegions. '
                         'Core tests run separately; this is not an iPhone build pass.')
              print(f'::warning::{message}')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('### iPhone simulator build: SKIPPED\n\n' + message + '\n')
          PY
      - name: Build iPhone simulator app
        if: steps.sdk.outputs.available == 'true'
        run: sh scripts/build-ios.sh simulator
      - uses: actions/upload-artifact@v4
        if: steps.sdk.outputs.available == 'true'
        with:
          name: Hongguo-iPhone-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Hongguo.app
          if-no-files-found: error
      - name: Report simulator build success
        if: steps.sdk.outputs.available == 'true'
        run: echo '### iPhone simulator build completed successfully' >> "$GITHUB_STEP_SUMMARY"
